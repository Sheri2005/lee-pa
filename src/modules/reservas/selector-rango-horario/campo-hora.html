<div
  class="flex min-h-11 items-center rounded-lg border bg-surface shadow-xs transition-[border-color,box-shadow] duration-200 focus-within:ring-4 hover:border-primary/40"
  [class]="
    invalido()
      ? 'border-red-700 focus-within:border-red-700 focus-within:ring-red-700/10'
      : abierto()
        ? 'border-primary ring-4 ring-primary/10'
        : 'border-border focus-within:border-primary focus-within:ring-primary/10'
  "
>
  <input
    type="text"
    inputmode="numeric"
    autocomplete="off"
    placeholder="hh:mm"
    maxlength="5"
    class="w-full min-w-0 flex-1 bg-transparent py-2 pl-3 text-primary-dark tabular-nums placeholder:text-text-secondary/50 focus:outline-none"
    [id]="idCampo()"
    [attr.name]="nombre() || null"
    [value]="texto()"
    [attr.aria-invalid]="invalido()"
    [attr.aria-describedby]="describedBy()"
    (input)="escribir($event, false)"
    (change)="escribir($event, true)"
    (keydown.alt.arrowdown)="alternar()"
  />
  <button
    type="button"
    class="mr-1 grid size-9 shrink-0 place-items-center rounded-md transition-colors hover:bg-muted hover:text-primary focus-visible:outline-2 focus-visible:outline-primary"
    [class]="abierto() ? 'bg-muted text-primary' : 'text-text-secondary'"
    aria-haspopup="listbox"
    [attr.aria-expanded]="abierto()"
    [attr.aria-label]="abierto() ? 'Cerrar lista de horas' : 'Elegir hora'"
    (click)="alternar()"
  >
    <svg
      class="size-[18px]"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="8.5" />
      <path d="M12 7.5V12l3 2" />
    </svg>
  </button>
</div>

@if (abierto()) {
  <div
    class="absolute top-full left-0 z-50 mt-2 w-[17rem] origin-top-left rounded-2xl border border-border bg-surface p-2 shadow-xl shadow-wine-deep/10 transition duration-200 ease-out starting:-translate-y-2 starting:scale-95 starting:opacity-0"
  >
    <p class="px-2 pt-1 pb-2 text-xs font-semibold tracking-wide text-text-secondary uppercase">
      Formato 24 horas
    </p>
    <div
      role="listbox"
      aria-label="Horas disponibles"
      class="grid max-h-60 grid-cols-4 gap-1 overflow-y-auto overscroll-contain pr-1"
    >
      @for (opcion of opciones(); track opcion) {
        <button
          type="button"
          role="option"
          class="rounded-lg py-2 text-sm tabular-nums transition-all duration-150 focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-primary"
          [class]="
            opcion === valor()
              ? 'bg-primary font-semibold text-white shadow-md shadow-primary/30 hover:bg-accent'
              : opcion.endsWith(':00')
                ? 'font-semibold text-primary-dark hover:bg-muted hover:text-primary'
                : 'text-text-secondary hover:bg-muted hover:text-primary'
          "
          [attr.data-hora]="opcion"
          [attr.aria-selected]="opcion === valor()"
          [attr.tabindex]="opcion === enfocada() ? 0 : -1"
          (click)="elegir(opcion)"
          (keydown)="tecla($event)"
        >
          {{ opcion }}
        </button>
      } @empty {
        <p class="col-span-4 px-2 py-3 text-sm text-text-secondary">No hay horas en este rango.</p>
      }
    </div>
  </div>
}
