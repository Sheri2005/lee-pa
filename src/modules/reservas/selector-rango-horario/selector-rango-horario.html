<div
  role="group"
  [attr.aria-labelledby]="id + '-titulo'"
  class="min-w-0"
  [class]="enmarcado() ? 'rounded-xl border border-border bg-surface shadow-sm' : ''"
>
  <div
    class="flex items-center gap-2.5 border-b border-border px-5 py-3.5"
    [class.sr-only]="!enmarcado()"
  >
    <span class="size-1.5 rounded-[1px] bg-accent-gold" aria-hidden="true"></span>
    <h3 [id]="id + '-titulo'" class="text-[15px] font-semibold text-primary-dark">
      {{ etiqueta() }}
    </h3>
  </div>

  <div [class]="enmarcado() ? 'px-5 py-4' : ''">
    <div class="grid gap-4 sm:grid-cols-3">
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-primary-dark" [for]="id + '-fecha'">Fecha</label>
        <app-campo-fecha
          nombre="fecha"
          [idCampo]="id + '-fecha'"
          [min]="fechaMin() ?? ''"
          [sinFinesDeSemana]="soloDiasHabiles()"
          [valor]="fecha()"
          [invalido]="campoInvalido('fecha')"
          [describedBy]="mostrarError() ? id + '-error' : null"
          (valorChange)="actualizar('fecha', $event)"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-primary-dark" [for]="id + '-inicio'">
          Hora de inicio
        </label>
        <app-campo-hora
          nombre="inicio"
          [idCampo]="id + '-inicio'"
          [min]="horaMin() ?? '00:00'"
          [paso]="pasoMinutos() || 15"
          [max]="horaMax() ?? '23:59'"
          [valor]="inicio()"
          [invalido]="campoInvalido('inicio')"
          [describedBy]="mostrarError() ? id + '-error' : null"
          (valorChange)="actualizar('inicio', $event)"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-primary-dark" [for]="id + '-fin'">Hora de fin</label>
        <app-campo-hora
          nombre="fin"
          [idCampo]="id + '-fin'"
          [min]="minimoFin()"
          [paso]="pasoMinutos() || 15"
          [max]="horaMax() ?? '23:59'"
          [valor]="fin()"
          [invalido]="campoInvalido('fin')"
          [describedBy]="mostrarError() ? id + '-error' : null"
          (valorChange)="actualizar('fin', $event)"
        />
      </div>
    </div>

    @if (mostrarError()) {
      <p
        [id]="id + '-error'"
        class="mt-3 flex items-start gap-2 rounded-lg bg-red-50 px-3 py-2 text-sm font-medium text-red-700 transition duration-200 starting:-translate-y-1 starting:opacity-0"
        role="alert"
      >
        <svg
          class="mt-0.5 size-4 shrink-0"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7.5v5M12 16h.01" />
        </svg>
        {{ error() }}
      </p>
    } @else if (duracion()) {
      <p
        class="mt-3 inline-flex flex-wrap items-center gap-2 rounded-full bg-muted px-3 py-1.5 text-sm text-primary-dark transition duration-200 starting:-translate-y-1 starting:opacity-0"
        aria-live="polite"
      >
        <svg
          class="size-4 text-primary"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m5 12.5 4.5 4.5L19 7.5" />
        </svg>
        <span class="font-medium">{{ fechaLegible(fecha()) }}</span>
        <span class="text-text-secondary tabular-nums"
          >· {{ inicio() }}–{{ fin() }} · {{ duracion() }}</span
        >
      </p>
    }
  </div>
</div>
