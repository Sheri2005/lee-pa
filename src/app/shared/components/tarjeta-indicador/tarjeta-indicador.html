<button
  type="button"
  class="w-full rounded-xl border border-border bg-surface p-5 text-left shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
  (click)="emitirClick()"
>
  <div class="flex items-start justify-between gap-4">
    <div class="min-w-0">
      <p class="text-sm font-medium text-text-secondary">
        {{ titulo }}
      </p>

      <p class="mt-2 text-3xl font-bold tracking-tight text-primary-dark">
        {{ valor }}
      </p>

      @if (detalle) {
        <p class="mt-2 text-sm text-text-secondary">
          {{ detalle }}
        </p>
      }
    </div>

    @if (icono) {
      <div
        class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl text-xl font-semibold"
        [class.bg-muted]="color === 'primary'"
        [class.text-primary]="color === 'primary'"
        [class.bg-header]="color === 'accent'"
        [class.text-accent]="color === 'accent'"
        [class.bg-filter]="color === 'gold'"
        [class.text-accent-gold]="color === 'gold'"
        [class.bg-background]="color === 'neutral'"
        [class.text-text-secondary]="color === 'neutral'"
        aria-hidden="true"
      >
        {{ icono }}
      </div>
    }
  </div>

  <div
    class="mt-4 h-1 w-full rounded-full"
    [class.bg-primary]="color === 'primary'"
    [class.bg-accent]="color === 'accent'"
    [class.bg-accent-gold]="color === 'gold'"
    [class.bg-text-secondary]="color === 'neutral'"
  ></div>
</button>
