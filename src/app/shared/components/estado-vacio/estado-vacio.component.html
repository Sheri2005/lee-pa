   <div
      role="status"
      class="flex flex-col items-center gap-3 rounded-lg border border-dashed border-border bg-header px-6 py-10 text-center"
    >
      <span class="text-4xl" aria-hidden="true">{{ icono() }}</span>
      <p class="m-0 text-text-secondary">{{ mensaje() }}</p>

      @if (textoAccion(); as texto) {
        <button
          type="button"
          class="rounded-md bg-primary px-4 py-2 text-sm font-medium text-white hover:bg-accent
                 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
          (click)="accion.emit()"
        >
          {{ texto }}
        </button>
      }
    </div>
