<form
  role="search"
  novalidate
  class="rounded-xl border border-border bg-filter text-primary-dark shadow-sm shadow-wine-deep/5"
  [attr.aria-label]="titulo()"
  (submit)="enviar($event)"
>
  <div class="flex items-center gap-2.5 border-b border-border px-5 py-3.5">
    <span class="size-1.5 rounded-[1px] bg-accent-gold" aria-hidden="true"></span>
    <span class="text-[15px] font-semibold">{{ titulo() }}</span>
    @if (filtrosActivos() > 0) {
      <span
        class="rounded-full border border-accent-gold bg-surface px-2 text-[11px] leading-5 font-semibold text-accent-gold"
        >{{ filtrosActivos() }} {{ filtrosActivos() === 1 ? 'activo' : 'activos' }}</span
      >
    }

    <!-- Solo en móvil: pliega o despliega los filtros. -->
    <button
      type="button"
      class="ml-auto inline-flex min-h-11 items-center gap-1.5 rounded-[7px] px-2 text-xs font-semibold text-primary transition-colors hover:bg-header focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent md:hidden"
      [attr.aria-expanded]="desplegada()"
      [attr.aria-controls]="id + '-campos'"
      (click)="alternar()"
    >
      {{ desplegada() ? 'Ocultar' : 'Mostrar' }}
      <svg
        class="size-4 transition-transform"
        [class.rotate-180]="desplegada()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.65"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="m6 9 6 6 6-6" />
      </svg>
    </button>
  </div>

  <div
    [id]="id + '-campos'"
    class="flex-wrap items-end gap-4 px-5 py-4 md:flex"
    [class.flex]="desplegada()"
    [class.hidden]="!desplegada()"
  >
    <div
      class="grid min-w-0 flex-1 grid-cols-[repeat(auto-fit,minmax(11rem,1fr))] items-end gap-4"
      [class.basis-full]="accionesAbajo()"
    >
      <ng-content />
    </div>

    <div
      class="ml-auto flex shrink-0 gap-2"
      [class]="accionesAbajo() ? 'w-full justify-end border-t border-border pt-4' : ''"
    >
      <button
        type="button"
        class="inline-flex min-h-[43px] items-center justify-center gap-2 rounded-[7px] border border-border bg-surface px-[19px] text-xs font-semibold text-primary transition-colors hover:bg-header focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
        (click)="limpiar.emit()"
      >
        <svg
          class="size-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.65"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="m6 6 12 12M6 18 18 6" />
        </svg>
        Limpiar
      </button>
      <button
        type="submit"
        class="inline-flex min-h-[43px] items-center justify-center gap-2 rounded-[7px] border border-transparent bg-primary px-[19px] text-xs font-semibold text-white transition-colors hover:bg-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
      >
        <svg
          class="size-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.65"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="m21 21-4.4-4.4M19 10.5a8.5 8.5 0 1 1-17 0 8.5 8.5 0 0 1 17 0" />
        </svg>
        Buscar
      </button>
    </div>
  </div>
</form>
