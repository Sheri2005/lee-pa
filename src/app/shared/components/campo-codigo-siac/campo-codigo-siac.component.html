<div class="grid gap-1.5">
  <label [for]="inputId" class="text-sm font-medium text-[#5A0015]">
    {{ label }}
    @if (required) {
      <span aria-hidden="true" class="text-red-700">*</span>
    }
  </label>

  <div class="relative">
    <input
      [id]="inputId"
      type="text"
      [value]="value"
      [disabled]="disabled"
      [required]="required"
      [placeholder]="placeholder"
      [class]="inputClasses"
      [attr.aria-invalid]="['taken', 'unavailable', 'required'].includes(validationState)"
      [attr.aria-busy]="validationState === 'checking'"
      [attr.aria-describedby]="validationMessage ? inputId + '-message' : null"
      autocomplete="off"
      spellcheck="false"
      (input)="handleInput($event)"
      (blur)="handleBlur()"
    />

    @if (statusIcon) {
      <span
        [class]="
          'absolute inset-y-0 right-3 flex items-center text-sm font-semibold ' + statusClasses
        "
        aria-hidden="true"
      >
        {{ statusIcon }}
      </span>
    }
  </div>

  @if (validationMessage) {
    <p
      [id]="inputId + '-message'"
      [class]="'text-xs ' + statusClasses"
      [attr.role]="
        ['taken', 'unavailable', 'required'].includes(validationState) ? 'alert' : 'status'
      "
    >
      {{ validationMessage }}
    </p>
  }
</div>
