<div class="max-w-3xl mx-auto p-6 bg-surface rounded-xl shadow-md border border-border space-y-6">
  <h2 class="text-2xl font-bold text-primary">Malla Curricular por Niveles (Vista Vigente)</h2>
  @for (n of niveles; track n.nivel) {
    <div class="p-4 border border-border rounded-lg bg-gray-50">
      <h3 class="font-bold text-gray-700 mb-2">Nivel {{ n.nivel }}</h3>
      <ul class="list-disc pl-5 text-sm space-y-1">
        @for (m of n.materias; track m) {
          <li class="text-gray-600">{{ m }}</li>
        }
      </ul>
    </div>
  }
</div>
