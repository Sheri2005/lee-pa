@let p = planificacion();

<dl
  class="flex flex-wrap gap-x-8 gap-y-4 rounded-lg border border-border bg-header px-4 py-3"
  aria-label="Datos de la planificación"
>
  <div class="flex min-w-32 flex-col gap-0.5">
    <dt class="text-xs uppercase tracking-wide text-text-secondary">Carrera</dt>
    <dd class="font-semibold text-primary-dark">{{ p.carrera.nombre }}</dd>
  </div>

  <div class="flex min-w-32 flex-col gap-0.5">
    <dt class="text-xs uppercase tracking-wide text-text-secondary">Facultad</dt>
    <dd class="font-semibold text-primary-dark">{{ p.facultad.nombre }}</dd>
  </div>

  <div class="flex min-w-32 flex-col gap-0.5">
    <dt class="text-xs uppercase tracking-wide text-text-secondary">Período</dt>
    <dd class="font-semibold text-primary-dark">{{ p.periodo.codigo }} · {{ p.periodo.nombre }}</dd>
  </div>

  <div class="flex min-w-32 flex-col gap-0.5">
    <dt class="text-xs uppercase tracking-wide text-text-secondary">Malla vigente</dt>
    <dd class="font-semibold text-primary-dark">{{ p.malla.nombre }} ({{ p.malla.anioInicio }})</dd>
  </div>

  <div class="flex min-w-32 flex-col gap-0.5">
    <dt class="text-xs uppercase tracking-wide text-text-secondary">Estado</dt>
    <dd>
      <!-- TODO(C5-08): cuando G5 publique app-estado-badge, reemplazar el span por
           <app-estado-badge [estado]="p.estado" />
           e importar su componente en el archivo .ts. -->
      <span class="rounded-full bg-muted px-2.5 py-0.5 text-xs font-semibold text-primary">
        {{ p.estado }}
      </span>
    </dd>
  </div>
</dl>
