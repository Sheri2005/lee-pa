<div class="max-w-xl mx-auto p-6 bg-surface rounded-xl shadow-md border border-border">
  <h2 class="text-2xl font-bold text-primary mb-6">Formulario de Docente</h2>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Usuario Vinculado</label>
      <select formControlName="usuarioId" class="w-full px-3 py-2 border border-border rounded-lg bg-surface focus:ring-2 focus:ring-primary focus:outline-none">
        <option value="" disabled>-- Seleccione usuario --</option>
        @for (u of usuarios; track u.id) {
          <option [value]="u.id">{{ u.nombre }}</option>
        }
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Cédula</label>
      <input type="text" formControlName="cedula" class="w-full px-3 py-2 border border-border rounded-lg focus:ring-2 focus:ring-primary focus:outline-none">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Departamento</label>
      <input type="text" formControlName="departamento" class="w-full px-3 py-2 border border-border rounded-lg focus:ring-2 focus:ring-primary focus:outline-none">
    </div>
    <div class="flex justify-end space-x-3 pt-4 border-t border-border">
      <button type="submit" class="px-6 py-2 bg-primary text-white font-medium rounded-lg hover:opacity-95">Guardar</button>
    </div>
  </form>
</div>
