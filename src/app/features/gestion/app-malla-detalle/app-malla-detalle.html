<div class="max-w-xl mx-auto p-6 bg-surface rounded-xl shadow-md border border-border space-y-4">
  <h2 class="text-2xl font-bold text-primary border-b border-border pb-2">Detalle de Malla</h2>
  <div class="grid grid-cols-2 gap-4 text-sm">
    <div><span class="font-semibold text-gray-600">ID:</span> {{ mallaId }}</div>
    <div><span class="font-semibold text-gray-600">Código:</span> {{ malla.codigo }}</div>
    <div><span class="font-semibold text-gray-600">Carrera:</span> {{ malla.carrera }}</div>
    <div class="col-span-2"><span class="font-semibold text-gray-600">Descripción:</span> {{ malla.descripcion }}</div>
  </div>
</div>
