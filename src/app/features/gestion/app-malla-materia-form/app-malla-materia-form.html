<div class="max-w-xl mx-auto p-6 bg-surface rounded-xl shadow-md border border-border">
  <h2 class="text-2xl font-bold text-primary mb-6">Asignar Materia a Malla</h2>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">ID Materia</label>
      <input type="number" formControlName="materiaId" class="w-full px-3 py-2 border border-border rounded-lg focus:ring-2 focus:ring-primary focus:outline-none">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Nivel</label>
      <input type="number" formControlName="nivel" class="w-full px-3 py-2 border border-border rounded-lg focus:ring-2 focus:ring-primary focus:outline-none">
    </div>
    <div class="flex justify-end space-x-3 pt-4 border-t border-border">
      <button type="button" (click)="onCancelar()" class="px-4 py-2 border border-border rounded-lg text-gray-700 hover:bg-gray-50">Cancelar</button>
      <button type="submit" class="px-6 py-2 bg-primary text-white font-medium rounded-lg hover:opacity-95">Guardar</button>
    </div>
  </form>
</div>
