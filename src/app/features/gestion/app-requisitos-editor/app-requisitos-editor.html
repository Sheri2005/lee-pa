<div class="max-w-xl mx-auto p-6 bg-surface rounded-xl shadow-md border border-border space-y-4">
  <h2 class="text-2xl font-bold text-primary">Editor de Requisitos</h2>
  <ul class="space-y-2">
    @for (req of requisitos; track req) {
      <li class="p-3 bg-gray-50 border border-border rounded-lg text-sm text-gray-700">{{ req }}</li>
    }
  </ul>
</div>
